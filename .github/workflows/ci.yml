name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: macOS + iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: desktop-local
        run: ./scripts/generate.sh

      - name: Test AppCore
        working-directory: desktop-local
        run: swift test --package-path Packages/AppCore

      - name: Build macOS
        working-directory: desktop-local
        run: |
          xcodebuild build \
            -project NdaniDesktop.xcodeproj \
            -scheme NdaniDesktop \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS
        working-directory: desktop-local
        run: |
          xcodebuild build \
            -project NdaniDesktop.xcodeproj \
            -scheme NdaniMobile \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Debug builds only. Release signing needs a keystore this repo does not
      # and must not contain.
      - name: Assemble and test
        working-directory: android-companion
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: desktop-windows
        run: npm install

      - name: Build installer
        working-directory: desktop-windows
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: hapo-ndani-windows
          path: desktop-windows/dist/*.exe
          retention-days: 14
